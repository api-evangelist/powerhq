aid: powerhq
name: PowerHQ
description: PowerHQ provides infrastructure for retail electricity commerce, offering a marketplace, drop‑in storefront, and a standardized API
  that gives access to plan data, real‑time pricing, validation, and enrollment across deregulated markets. It serves energy providers, developers,
  partners, and brokers who want to list plans, integrate enrollment, or add energy shopping experiences to their sites with minimal IT effort.
